name: A server it cannot talk to
description: A server that OpenSSH's own client reaches, and this one does not.
labels: [compatibility]
body:
  - type: input
    id: server
    attributes:
      label: The server's version string
      placeholder: SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13
    validations:
      required: true
  - type: textarea
    id: offered
    attributes:
      label: What it offers
      description: The output of `ssh -vv user@host 2>&1 | grep -A12 'peer server KEXINIT'`.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: control
    attributes:
      label: The control
      options:
        - label: OpenSSH's ssh connects to the same server, from the same place, with the same credentials.
          required: true
  - type: textarea
    id: error
    attributes:
      label: The error
      render: text
